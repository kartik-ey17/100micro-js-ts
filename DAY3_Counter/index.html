<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Counter</title>
</head>
<body>
    <div class="main">
        <h1>Counter</h1>
        <p>Current count: <br><span id="count">0</span></p>
        <button id="decrement">-</button>
        <button id="increment">+</button>
        <p id="reset">Reset Counter</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
